<svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- twol = two-level rules: upper (lexical) tape and lower (surface) tape -->
  <path d="M2.5 4.5H13.5" stroke="#6C707E" stroke-width="1.7" stroke-linecap="round"/>
  <path d="M2.5 11.5H13.5" stroke="#6C707E" stroke-width="1.7" stroke-linecap="round"/>
  <!-- the : pairing: one dot on each tape -->
  <circle cx="8" cy="4.5" r="1.5" fill="#9B7BD4"/>
  <circle cx="8" cy="11.5" r="1.5" fill="#9B7BD4"/>
</svg>
