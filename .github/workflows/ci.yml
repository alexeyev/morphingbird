name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Fast, self-contained gate: the IntelliJ-free core builds and its JUnit
  # suite passes. No IDE distribution, no network corpora — runs in seconds.
  core:
    name: Core (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test :core
        run: ./gradlew :core:build --stacktrace

      - name: Upload core test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-report
          path: core/build/reports/tests/test
          if-no-files-found: ignore

  # The IntelliJ plugin builds and the JetBrains Plugin Verifier is happy.
  # This needs the IDE distribution (fetched by the IntelliJ Platform Gradle
  # plugin), so it is heavier than the core job.
  plugin:
    name: Plugin (build + verify)
    runs-on: ubuntu-latest
    needs: core
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                        /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
            df -h / | tail -1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify plugin configuration
        run: ./gradlew :morphingbird:verifyPluginProjectConfiguration --stacktrace

      - name: Build plugin
        run: ./gradlew :morphingbird:buildPlugin --stacktrace

      - name: Run JetBrains Plugin Verifier
        run: ./gradlew :morphingbird:verifyPlugin --stacktrace

      - name: Upload plugin artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morphingbird-plugin
          path: idea-plugin/build/distributions/*.zip
          if-no-files-found: ignore

      - name: Upload verifier report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plugin-verifier-report
          path: idea-plugin/build/reports/pluginVerifier
          if-no-files-found: ignore
